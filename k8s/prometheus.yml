global:
  scrape_interval: 5s
scrape_configs:
  - job_name: digital-twin
    static_configs: [{targets: ["digital-twin-service:8080"]}]
  - job_name: orchestrator
    static_configs: [{targets: ["orchestrator-service:8082"]}]
  - job_name: predictor
    static_configs: [{targets: ["predictor-service:8081"]}]
  - job_name: telemetry
    static_configs: [{targets: ["telemetry-service:8083"]}]
