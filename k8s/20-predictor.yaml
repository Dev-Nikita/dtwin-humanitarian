apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictor-service
  namespace: dtwin
spec:
  replicas: 3
  selector: {matchLabels: {app: predictor-service}}
  template:
    metadata:
      labels: {app: predictor-service}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8081"}
    spec:
      containers:
        - name: api
          image: ghcr.io/dtwin-humanitarian/predictor-service:1.0.0
          ports: [{containerPort: 8081, name: http}]
          envFrom: [{configMapRef: {name: dtwin-config}}]
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          livenessProbe: {httpGet: {path: /healthz, port: 8081}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: 8081}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: predictor-service, namespace: dtwin, labels: {app: predictor-service}}
spec:
  selector: {app: predictor-service}
  ports: [{name: http, port: 8081, targetPort: 8081}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: predictor-service, namespace: dtwin}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: predictor-service}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
